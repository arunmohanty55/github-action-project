name: Hello Arun Aqua

'on':
  push:
    branches:
      - main

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        run: echo "hello dosto"

      - name: Say hello to username
        run: echo "hello Arun"

  details:
    runs-on: ubuntu-latest
    steps:
      - name: Show Python version
        run: python --version

      - name: Show Docker version
        run: docker --version
